name = "curated-kitchen-import"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Non-secret config. The free /url (paste-a-link) route needs only these vars.
# The AI key (for the smart text/photo route) is a secret set separately —
# see README.
[vars]
FIREBASE_PROJECT_ID = "curated-kitchen"
ALLOWED_ORIGIN = "https://cwang427.github.io"
# Optional: pin the Gemini model. Default in code is gemini-3.5-flash-lite, with
# an automatic fallback to gemini-3.5-flash. Setting this forces a single model
# (no fallback) — e.g. to try gemini-3.6-flash once the free tier is less busy.
# GEMINI_MODEL = "gemini-3.6-flash"
# Optional (paid alternative): the Claude model, used only if no GEMINI_API_KEY.
# ANTHROPIC_MODEL = "claude-sonnet-5"

# Keep the Worker's logs for a few days (Workers Logs, free plan: 3 days), so an
# import that went wrong can be looked up afterwards in the Cloudflare dashboard
# (Workers & Pages → curated-kitchen-import → Logs) — not only while someone
# happens to be running `wrangler tail`. Each link import logs one `import`
# line (host, route, time, photos) that can be filtered there.
[observability]
enabled = true

# The import queue (src/queue.ts): one Durable Object per person, which keeps
# retrying queued links on a timer even while the app is closed. Declared here
# and created by `wrangler deploy` — no dashboard setup, no id to paste in.
# SQLite-backed Durable Objects are included in the Workers free plan.
[[durable_objects.bindings]]
name = "QUEUE"
class_name = "ImportQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ImportQueue"]
