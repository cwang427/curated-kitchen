# Push recipes/*.json into Firestore whenever they change.
#
# This is what lets recipes be added from a phone: edit a JSON file, commit,
# and CI syncs it to Firestore — no service-account key ever touches your
# device. The key lives only as an encrypted repo secret.
#
# One-time setup (see README › Adding recipes):
#   • Secret  FIREBASE_SERVICE_ACCOUNT — the service-account JSON, pasted whole.
#   • Variable KITCHEN_HOUSEHOLD_ID    — the household these recipes belong to.
name: Sync recipes

on:
  push:
    branches:
      - main
      - claude/clever-hawking-xe57hp
    paths:
      - 'recipes/**'
      - 'scripts/sync-recipes.ts'
      - 'scripts/recipe-files.ts'
      - 'src/lib/recipeSchema.ts'
  workflow_dispatch:

# One sync at a time, so two quick pushes can't race to write the same docs.
concurrency:
  group: sync-recipes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HH: ${{ vars.KITCHEN_HOUSEHOLD_ID }}
        run: |
          missing=
          [ -z "$SA" ] && missing="$missing FIREBASE_SERVICE_ACCOUNT(secret)"
          [ -z "$HH" ] && missing="$missing KITCHEN_HOUSEHOLD_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Recipe sync isn't configured yet. Missing:$missing"
            echo "See README › Adding recipes for the one-time setup."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate recipes
        run: npm run validate:recipes

      - name: Write service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          # projectId is read straight from the key, so nothing else to set.
          echo "FIREBASE_PROJECT_ID=$(node -p "require('$RUNNER_TEMP/sa.json').project_id")" >> "$GITHUB_ENV"

      - name: Sync
        run: npm run sync:recipes -- --household="${{ vars.KITCHEN_HOUSEHOLD_ID }}"
