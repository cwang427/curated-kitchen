# Restore recipes from the repo archive into Firestore — MANUAL ONLY (retired).
#
# The repo used to be the authoritative source for recipes: every push synced
# recipes/*.json into Firestore and pruned anything removed. That's retired now
# that recipes are authored and owned inside the app — a live sync would clobber
# in-app edits by slug on every push. So this no longer runs on push.
#
# The recipes/*.json files are kept as a FROZEN ARCHIVE / backup. If you ever
# need to re-seed a kitchen from that archive, run this workflow by hand
# (Actions › Restore recipes from archive › Run workflow). It upserts by slug
# and does NOT prune, so it won't delete app-created recipes — but it WILL
# overwrite any in-app edits to a recipe whose slug matches an archived file.
# Use it only for disaster recovery.
#
# Requires (same one-time setup as before):
#   • Secret  FIREBASE_SERVICE_ACCOUNT — the service-account JSON, pasted whole.
#   • Variable KITCHEN_HOUSEHOLD_ID    — the household to restore into.
name: Restore recipes from archive

on:
  workflow_dispatch:

# One restore at a time.
concurrency:
  group: sync-recipes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HH: ${{ vars.KITCHEN_HOUSEHOLD_ID }}
        run: |
          missing=
          [ -z "$SA" ] && missing="$missing FIREBASE_SERVICE_ACCOUNT(secret)"
          [ -z "$HH" ] && missing="$missing KITCHEN_HOUSEHOLD_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Recipe restore isn't configured. Missing:$missing"
            echo "See README › Adding recipes for the one-time setup."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate recipes
        run: npm run validate:recipes

      - name: Write service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          # projectId is read straight from the key, so nothing else to set.
          echo "FIREBASE_PROJECT_ID=$(node -p "require('$RUNNER_TEMP/sa.json').project_id")" >> "$GITHUB_ENV"

      - name: Restore
        # No --prune: a manual restore must never delete app-created recipes.
        run: npm run sync:recipes -- --household="${{ vars.KITCHEN_HOUSEHOLD_ID }}"
